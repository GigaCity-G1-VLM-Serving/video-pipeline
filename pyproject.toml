[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gigacity-contracts = { workspace = true }

[dependency-groups]
dev = [
  "gigacity-contracts",
  "poethepoet>=0.32,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
src = ["packages/*/src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.poe.tasks]
format = [
  { cmd = "ruff check --select I --fix ." },
  { cmd = "ruff format ." },
]
test = "pytest"
